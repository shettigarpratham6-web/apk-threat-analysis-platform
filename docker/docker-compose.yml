# Note: The Android emulator, Frida server, and mitmproxy run on the host machine.
# Backend and frontend services run in containers below.

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../backend/results:/app/backend/results

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
